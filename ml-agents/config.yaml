behaviors:
  AdaptAgent:
    trainer_type: sac # SAC algorithm for training
    hyperparameters:
      # Training Hyperparameters
      batch_size: 512
      buffer_size: 10240
      learning_rate: 0.0003
      learning_rate_schedule: linear

      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 32.0 # Steps equal to number of agents in training scene * 1.5
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 32.0

    # Neural network config
    network_settings:
      vis_encode_type: simple
      normalize: false
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99

    keep_checkpoints: 3
    even_checkpoints: True
    max_steps: 15000
    time_horizon: 64
    summary_freq: 2500

engine_settings:
  time_scale: 10
  no_graphics: false